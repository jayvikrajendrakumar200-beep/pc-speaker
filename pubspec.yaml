name: pc_speaker
description: Stream PC audio to iPhone over WiFi/USB, use iPhone mic on PC
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  http: ^1.2.0
  shared_preferences: ^2.2.2
  permission_handler: ^11.1.0
  flutter_local_notifications: ^17.1.2
  record: ^5.0.4
  web_socket_channel: ^2.4.0
  provider: ^6.1.1
  qr_flutter: ^4.1.0           # QR code generation (Windows)
  mobile_scanner: ^5.0.0       # QR code scanning (iPhone)
  network_info_plus: ^6.0.2    # Auto-detect local IP (Windows)
  process_run: ^1.1.2          # Launch Python server from Flutter (Windows)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true